name: CI SIGPT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verificar formato y compilacion
        run: mvn -B -ntp clean verify

      - name: Comprobar que el esquema SQL es coherente
        run: |
          grep -q "CREATE TABLE pedido" src/main/resources/db/schema.sql
          grep -q "CREATE TABLE movimiento_kardex" src/main/resources/db/schema.sql
          echo "Esquema SQL correcto"

      - name: Publicar artefacto
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sigpt-jar
          path: target/sigpt-1.0.0.jar
