<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${titulo})}"></head>
<body>
<div th:replace="~{layout :: layout(~{::contenido})}">
  <div th:fragment="contenido">
    <h2 class="titulo-pantalla" th:text="${titulo}">Usuarios</h2>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="card h-100">
          <div class="card-header">Registrar usuario</div>
          <div class="card-body">
            <form th:action="@{/seguridad/usuarios/guardar}" method="post" th:object="${usuario}">
              <div class="mb-3">
                <label class="form-label" for="codUsuario">Codigo de usuario</label>
                <input type="text" class="form-control" id="codUsuario" th:field="*{codUsuario}"
                       required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="nombres">Nombres</label>
                <input type="text" class="form-control" id="nombres" th:field="*{nombres}" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="area">Area</label>
                <input type="text" class="form-control" id="area" th:field="*{area}">
              </div>
              <div class="mb-3">
                <label class="form-label" for="idPerfil">Perfil</label>
                <select class="form-select" id="idPerfil" th:field="*{idPerfil}" required>
                  <option value="">Seleccione</option>
                  <option th:each="p : ${perfiles}" th:value="${p.idPerfil}"
                          th:text="${p.codPerfil} + ' - ' + ${p.nombrePerfil}">JPROD</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="clave">Clave inicial</label>
                <input type="password" class="form-control" id="clave" name="clave"
                       placeholder="Minimo 8 caracteres">
                <div class="form-text">Se guarda cifrada con PBKDF2 y sal por usuario.</div>
              </div>
              <div class="d-flex gap-2 justify-content-end">
                <button type="submit" class="btn btn-primary">Grabar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-8">
        <div class="card h-100">
          <div class="card-header">Usuarios del sistema</div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
              <tr><th>Codigo</th><th>Nombres</th><th>Area</th><th>Perfil</th>
                <th>Intentos</th><th>Ultimo acceso</th><th>Estado</th><th></th></tr>
              </thead>
              <tbody>
              <tr th:each="u : ${usuarios}">
                <td th:text="${u.codUsuario}">jperez</td>
                <td th:text="${u.nombres}">Jorge Perez</td>
                <td th:text="${u.area}">Gerencia</td>
                <td th:text="${u.perfil != null} ? ${u.perfil.nombrePerfil} : ''">Perfil</td>
                <td th:text="${u.intentosFallidos}">0</td>
                <td th:text="${u.ultimoAcceso}">2026-11-12</td>
                <td>
                  <span class="badge"
                        th:classappend="${u.estado} ? 'bg-success' : 'bg-secondary'"
                        th:text="${u.estado} ? 'Activo' : 'Inactivo'">Activo</span>
                </td>
                <td class="text-end">
                  <form th:action="@{/seguridad/usuarios/clave}" method="post" class="d-flex gap-1">
                    <input type="hidden" name="idUsuario" th:value="${u.idUsuario}">
                    <input type="password" name="clave" class="form-control form-control-sm"
                           style="width:120px" placeholder="Nueva clave">
                    <button type="submit" class="btn btn-sm btn-outline-primary">Resetear</button>
                  </form>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
