<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layoutLogin :: head}"></head>
<body>
<div th:replace="~{layoutLogin :: layout(~{::contenido})}">
  <div th:fragment="contenido">
    <div class="alert alert-danger" role="alert" th:if="${mensajeError}" th:text="${mensajeError}">
      Usuario o contrasena incorrectos
    </div>

    <form th:action="@{/seguridad/login}" method="post" th:object="${formLogin}">
      <div class="mb-3">
        <label for="codUsuario" class="form-label">Usuario</label>
        <input type="text" class="form-control form-control-lg" id="codUsuario" name="codUsuario"
               th:value="${codUsuario}" placeholder="Ingrese su usuario" required autofocus>
      </div>

      <div class="mb-4">
        <label for="clave" class="form-label">Contrasena</label>
        <input type="password" class="form-control form-control-lg" id="clave" name="clave"
               placeholder="Ingrese su contrasena" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100">Ingresar</button>
    </form>

    <div class="pie-login">
      <p class="small">Tras 3 intentos fallidos la cuenta se bloquea temporalmente.</p>
      <p class="small">La sesion expira por inactividad a los 15 minutos.</p>
    </div>
  </div>
</div>

</body>
</html>
