<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${titulo})}"></head>
<body>
<div th:replace="~{layout :: layout(~{::contenido})}">
  <div th:fragment="contenido">
    <h2 class="titulo-pantalla" th:text="${titulo}">Ordenes de Compra</h2>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${mensajeError}" th:text="${mensajeError}"></div>
    <div class="alert alert-info" th:if="${mensajeSinDatos}" th:text="${mensajeSinDatos}"></div>

    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="card h-100">
          <div class="card-header">Emitir orden de compra</div>
          <div class="card-body">
            <form th:action="@{/abastecimiento/ordenes-compra/guardar}" method="post"
                  th:object="${ordenForm}">
              <div class="mb-3">
                <label class="form-label" for="idProveedor">Proveedor</label>
                <select class="form-select" id="idProveedor" th:field="*{idProveedor}" required>
                  <option value="">Seleccione</option>
                  <option th:each="p : ${proveedores}" th:value="${p.idProveedor}"
                          th:text="${p.codigo + ' - ' + p.razonSocial}">PRV-001</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="idInsumo">Insumo</label>
                <select class="form-select" id="idInsumo" th:field="*{idInsumo}" required>
                  <option value="">Seleccione</option>
                  <option th:each="i : ${insumos}" th:value="${i.idInsumo}"
                          th:text="${i.codigo + ' - ' + i.nombre}">INS-FIB-001</option>
                </select>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label" for="cantidad">Cantidad</label>
                  <input type="number" step="0.01" min="0" class="form-control" id="cantidad"
                         th:field="*{cantidad}" required>
                </div>
                <div class="col-6">
                  <label class="form-label" for="precioUnitario">Precio unitario</label>
                  <input type="number" step="0.0001" min="0" class="form-control"
                         id="precioUnitario" th:field="*{precioUnitario}">
                </div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label" for="fechaEmision">Emision</label>
                  <input type="date" class="form-control" id="fechaEmision"
                         th:field="*{fechaEmision}">
                </div>
                <div class="col-6">
                  <label class="form-label" for="fechaEntregaEsperada">Entrega esperada</label>
                  <input type="date" class="form-control" id="fechaEntregaEsperada"
                         th:field="*{fechaEntregaEsperada}">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="moneda">Moneda</label>
                <select class="form-select" id="moneda" th:field="*{moneda}">
                  <option value="USD">USD</option>
                  <option value="PEN">PEN</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="observacionesOrden">Observaciones</label>
                <textarea class="form-control" id="observacionesOrden" rows="2"
                          th:field="*{observaciones}"></textarea>
              </div>
              <div class="d-flex gap-2 justify-content-end">
                <button type="submit" class="btn btn-primary">Emitir orden</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-8">
        <div class="card h-100">
          <div class="card-header">Ordenes emitidas</div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
              <tr><th>Codigo</th><th>Proveedor</th><th>Monto</th><th>Emision</th>
                <th>Entrega</th><th>Estado</th><th></th></tr>
              </thead>
              <tbody>
              <tr th:each="o : ${ordenesCompra}">
                <td th:text="${o.codigo}">OC-2026-001</td>
                <td th:text="${o.idProveedor}">1</td>
                <td th:text="${o.montoTotal}">0</td>
                <td th:text="${o.fechaEmision}">2026-11-12</td>
                <td th:text="${o.fechaEntregaEsperada}">2026-11-20</td>
                <td>
                  <span class="badge" th:classappend="${@clases.badge(o.estado)}"
                        th:text="${o.estado}">EMITIDA</span>
                </td>
                <td class="text-end">
                  <a class="btn btn-sm btn-outline-secondary"
                     th:href="@{'/abastecimiento/ordenes-compra/pdf/' + ${o.idOrdenCompra}}">PDF</a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(ordenesCompra)}">
                <td colspan="7" class="text-center text-muted py-4">
                  No se encontraron datos para los criterios seleccionados.
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
