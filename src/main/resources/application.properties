# =============================================================================
#  SIGPT - Configuracion general
#  Los secretos NUNCA van aqui: van en application-local.properties (fuera de git)
#  o en variables de entorno. Ver .gitignore y RDS5 / OWASP A02.
# =============================================================================

spring.application.name=sigpt
server.port=8080
server.servlet.session.timeout=15m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Base de datos (RDS1: MySQL 8.0) ---
# El archivo local con el secreto vive en la raiz del proyecto y NO se versiona
# (ver .gitignore). Si no existe, la aplicacion arranca igual (CI, por ejemplo).
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=jdbc:mysql://${SIGPT_DB_HOST:localhost}:${SIGPT_DB_PORT:3306}/${SIGPT_DB_NAME:sigpt}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=${SIGPT_DB_USER:sigpt_app}
spring.datasource.password=${SIGPT_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=SigptPool

# --- Thymeleaf (vistas en servidor, D5) ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# --- Parametros de negocio ---
# Los umbrales (1000 m, 40%, 16 h, 15%, 3 intentos...) viven en la tabla
# `parametro` y se cargan en el Singleton ParametrosNegocio. No se codifican.
sigpt.parametros.habilitado=true

# --- Mensajes ---
spring.messages.basename=mensajes
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.textilesandinos.sigpt=INFO
logging.level.com.textilesandinos.sigpt.datos=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
